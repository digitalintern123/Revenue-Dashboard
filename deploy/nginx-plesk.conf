# Plesk → Websites & Domains → YOUR-DOMAIN.COM → Apache & nginx Settings
#   1. Untick "Proxy mode" (so nginx serves the site itself).
#   2. Paste everything below into "Additional nginx directives" and press OK.
# The regex location (~ /) takes priority over Plesk's own "location /",
# so there is no "duplicate location" error.

client_max_body_size 300m;          # matches server.maxUploadSize in config.toml

location ~ / {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;

    # Streamlit talks to the browser over a WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;        # keep the WebSocket open
    proxy_send_timeout 600;          # large uploads
    proxy_buffering off;
}
