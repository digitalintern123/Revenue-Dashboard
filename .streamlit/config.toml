[server]
maxUploadSize = 300
maxMessageSize = 300

[browser]
gatherUsageStats = false
serverPort = 8501

[runner]
magicEnabled = false
fastReruns = true

[logger]
level = "error"

[client]
# Hide the "Deploy" button and developer menu for end users.
toolbarMode = "minimal"

[theme]
primaryColor = "#142248"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F3EE"
textColor = "#1B2437"
font = "sans serif"
