[server]
maxUploadSize = 300
maxMessageSize = 300

[browser]
gatherUsageStats = false
serverPort = 8501

[runner]
magicEnabled = false
fastReruns = true

[logger]
level = "error"

[client]
# Hide the "Deploy" button and developer menu for end users.
toolbarMode = "minimal"

[theme]
primaryColor = "#1E3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#1F2937"
font = "sans serif"
